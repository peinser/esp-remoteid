name: Cloudbuild
run-name: cloudbuild-${{ inputs.build-id }}

# Triggered by the web configurator backend (Cloudflare Worker) via the
# GitHub API workflow dispatch endpoint. Not intended for manual use.
#
# Prerequisites:
#   1. Publish .dev/esp-idf-build-action/ as a separate GitHub repository
#      (peinser/esp-idf-build-action) and push a v1 tag.
#   2. Set the GITHUB_TOKEN secret in the Cloudflare Worker with actions:write
#      and actions:read permissions on this repository.

on:
  workflow_dispatch:
    inputs:
      build-id:
        description: Correlation UUID generated by the web configurator
        required: true
        type: string
      sdkconfig-overlay-b64:
        description: Base64-encoded sdkconfig.defaults overlay from the web form
        required: true
        type: string

concurrency:
  group: cloudbuild-${{ inputs.build-id }}
  cancel-in-progress: false

jobs:
  build:
    uses: peinser/actions/.github/workflows/esp-remoteid-build.yml@v1
    permissions:
      contents: read
    with:
      idf-version: release-v5.5
      target: esp32s3
      sdkconfig-overlay-b64: ${{ inputs.sdkconfig-overlay-b64 }}
      artifact-name: firmware-${{ inputs.build-id }}
      artifact-retention-days: 1
